services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: ../apps/api
    ports: ["4000:4000"]
    environment:
      PORT: 4000
      AGENT_RUNTIME_URL: http://agent-runtime:8000
      CORS_ORIGINS: http://localhost:5173
      ALLOW_LOCAL_FALLBACK: 'false'
      MONGODB_URI: mongodb://mongo:27017/eduswarm
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      agent-runtime: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  agent-runtime:
    build: ../services/agent-runtime
    environment:
      PORT: 8000
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: eduswarm_knowledge
      OPENROUTER_MODEL: openrouter/free
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      EDUSWARM_STATE_DIR: /tmp/eduswarm-state
    volumes: ["runtime-state:/tmp/eduswarm-state"]
    ports: ["8000:8000"]
    depends_on:
      qdrant: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build:
      context: ../apps/web
      args:
        VITE_API_URL: http://localhost:4000
    environment:
      VITE_API_URL: http://localhost:4000
    ports: ["5173:5173"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  mongo-data:
  qdrant-data:
  runtime-state:
