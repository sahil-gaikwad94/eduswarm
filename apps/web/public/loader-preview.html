<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduSwarm Loader Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1e1b2e;--muted:#777187;--line:#ded9ce;--violet:#7557f5;--lime:#bdf47c;--peach:#ffd8c2}
*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;color:#1e1b2e}
.brand{font-family:'Space Grotesk';font-weight:700;display:inline-flex;align-items:center;gap:9px;letter-spacing:-.04em}
.brand-mark{color:var(--violet);font-size:26px}
.demo-controls{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99;display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px}
.demo-controls button{border:0;background:transparent;padding:7px 12px;border-radius:99px;font-weight:700;cursor:pointer}
.demo-controls button.on{background:var(--violet);color:#fff}
/* ---------- Playful loading screen ---------- */
.loader-screen{position:fixed;inset:0;z-index:60;display:grid;place-items:center;overflow:hidden;background:radial-gradient(120% 120% at 50% 0%,#f3efff 0%,#fff9e6 45%,#ffeede 100%)}
.loader-bg{position:absolute;inset:0;pointer-events:none}
.loader-bg .blob{position:absolute;border-radius:50%;filter:blur(6px);opacity:.55;animation:blobDrift 14s ease-in-out infinite}
.blob-a{width:320px;height:320px;background:radial-gradient(circle at 30% 30%,#cdbcff,#a78dff);top:-90px;left:-70px}
.blob-b{width:260px;height:260px;background:radial-gradient(circle at 40% 40%,#bdf47c,#8fd94f);bottom:-80px;right:-60px;animation-delay:-4s}
.blob-c{width:220px;height:220px;background:radial-gradient(circle at 40% 40%,#ffd8c2,#ffb992);top:55%;left:8%;animation-delay:-8s}
@keyframes blobDrift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(24px,-20px) scale(1.08)}66%{transform:translate(-18px,16px) scale(.94)}}
.loader-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px;width:min(520px,92vw)}
.loader-brand{margin-bottom:6px}
.loader-brand .brand{font-size:24px}
.loader-stage{position:relative;width:280px;height:250px;display:grid;place-items:center;margin:8px 0 4px}
.loader-shadow{position:absolute;bottom:24px;width:130px;height:22px;background:rgba(30,27,46,.16);border-radius:50%;filter:blur(3px);animation:shadowPulse 1.1s ease-in-out infinite}
@keyframes shadowPulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(.72);opacity:.28}}

/* the doodle character */
.loader-doodle{position:relative;z-index:2}
.loader-stage .doodle-antenna{width:4px;height:38px;background:var(--ink);margin:auto;position:relative}
.loader-stage .doodle-antenna:before{content:'✦';position:absolute;top:-20px;left:-8px;color:#e8c944;font-size:18px;animation:sparkTwinkle 1.4s ease-in-out infinite}
@keyframes sparkTwinkle{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(1.4) rotate(25deg);opacity:.65}}
.loader-stage .doodle-body{width:150px;height:165px;border:5px solid var(--ink);background:#f4d45c;border-radius:48% 52% 45% 48%;position:relative;box-shadow:inset -14px -12px #e7bb43}
.loader-stage .eye{position:absolute;top:60px;width:11px;height:16px;border-radius:50%;background:var(--ink);animation:blink 3.4s infinite}
.loader-stage .eye.left{left:44px}
.loader-stage .eye.right{right:44px}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.loader-stage .cheek{position:absolute;top:82px;width:16px;height:10px;border-radius:50%;background:#ff9d8a;opacity:.75}
.loader-stage .cheek-left{left:30px}
.loader-stage .cheek-right{right:30px}
.loader-stage .smile{position:absolute;left:56px;top:86px;width:34px;height:20px;border-bottom:4px solid var(--ink);border-radius:50%}
.loader-stage .doodle-feet{display:flex;justify-content:space-around;margin-top:-2px;width:150px}
.loader-stage .doodle-feet i{width:28px;height:11px;border-bottom:5px solid var(--ink);border-radius:50%;transform-origin:center}
.doodle-arm{position:absolute;top:96px;width:40px;height:6px;background:var(--ink);border-radius:6px;z-index:1}
.arm-left{left:-26px;transform-origin:right center;transform:rotate(28deg)}
.arm-right{right:-26px;transform-origin:left center;transform:rotate(-28deg)}

/* floating props */
.prop{position:absolute;z-index:0;opacity:0;transition:opacity .4s}
.prop-note{font-size:26px;color:var(--violet)}
.note-1{top:26px;left:34px}
.note-2{top:56px;right:34px}
.prop-book{font-size:30px;bottom:30px;left:26px}
.prop-star{color:#e8c944;font-size:20px}
.star-1{top:20px;right:60px}
.star-2{bottom:60px;right:34px}
.juggle-ball{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink);top:70px;left:50%;margin-left:-10px}
.ball-1{background:var(--violet)}
.ball-2{background:var(--lime)}
.ball-3{background:var(--peach)}

/* ---- MOOD: dancing ---- */
.is-dancing .loader-doodle{animation:danceBob .62s ease-in-out infinite}
.is-dancing .doodle-body{animation:danceWobble .62s ease-in-out infinite}
.is-dancing .arm-left{animation:armWaveL .62s ease-in-out infinite}
.is-dancing .arm-right{animation:armWaveR .62s ease-in-out infinite}
.is-dancing .prop-note,.is-dancing .prop-star{opacity:1}
.is-dancing .note-1{animation:noteFloat 1.6s ease-in-out infinite}
.is-dancing .note-2{animation:noteFloat 1.6s ease-in-out .4s infinite}
@keyframes danceBob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-16px) rotate(4deg)}}
@keyframes danceWobble{0%,100%{transform:skewX(-5deg)}50%{transform:skewX(5deg)}}
@keyframes armWaveL{0%,100%{transform:rotate(20deg)}50%{transform:rotate(-45deg)}}
@keyframes armWaveR{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(45deg)}}
@keyframes noteFloat{0%{transform:translateY(0) rotate(-8deg);opacity:.3}50%{transform:translateY(-18px) rotate(8deg);opacity:1}100%{transform:translateY(-30px) rotate(-8deg);opacity:0}}

/* ---- MOOD: walking ---- */
.is-walking .loader-doodle{animation:walkAcross 3.4s ease-in-out infinite}
.is-walking .doodle-body{animation:walkBob .5s ease-in-out infinite}
.is-walking .foot-left{animation:stepL .5s ease-in-out infinite}
.is-walking .foot-right{animation:stepR .5s ease-in-out infinite}
.is-walking .arm-left{animation:stepR .5s ease-in-out infinite}
.is-walking .arm-right{animation:stepL .5s ease-in-out infinite}
.is-walking .prop-book,.is-walking .prop-star{opacity:1}
@keyframes walkAcross{0%,100%{transform:translateX(-70px)}50%{transform:translateX(70px) scaleX(1)}50.01%{transform:translateX(70px) scaleX(-1)}99.99%{transform:translateX(-70px) scaleX(-1)}}
@keyframes walkBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes stepL{0%,100%{transform:rotate(18deg)}50%{transform:rotate(-18deg)}}
@keyframes stepR{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}

/* ---- MOOD: juggling ---- */
.is-juggling .loader-doodle{animation:juggleLean 1s ease-in-out infinite}
.is-juggling .arm-left{transform:rotate(-55deg)}
.is-juggling .arm-right{transform:rotate(55deg)}
.is-juggling .juggle-ball{opacity:1}
.is-juggling .ball-1{animation:juggle1 .9s ease-in-out infinite}
.is-juggling .ball-2{animation:juggle2 .9s ease-in-out infinite}
.is-juggling .ball-3{animation:juggle3 .9s ease-in-out infinite}
@keyframes juggleLean{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes juggle1{0%{transform:translate(-34px,0)}50%{transform:translate(0,-70px)}100%{transform:translate(34px,0)}}
@keyframes juggle2{0%{transform:translate(34px,0)}50%{transform:translate(0,-90px)}100%{transform:translate(-34px,0)}}
@keyframes juggle3{0%{transform:translate(0,-40px)}50%{transform:translate(-34px,10px)}100%{transform:translate(0,-40px)}}

/* ---- MOOD: cartwheel / spin silly ---- */
.is-cartwheel .loader-doodle{animation:spinSilly 1.6s ease-in-out infinite}
.is-cartwheel .arm-left{animation:armWaveL .4s ease-in-out infinite}
.is-cartwheel .arm-right{animation:armWaveR .4s ease-in-out infinite}
.is-cartwheel .prop-star{opacity:1}
.is-cartwheel .star-1{animation:sparkTwinkle .8s ease-in-out infinite}
.is-cartwheel .star-2{animation:sparkTwinkle .8s ease-in-out .3s infinite}
@keyframes spinSilly{0%{transform:rotate(0) scale(1)}40%{transform:rotate(360deg) scale(1)}55%{transform:rotate(360deg) scale(1.08,.9)}70%{transform:rotate(360deg) scale(.94,1.08)}100%{transform:rotate(360deg) scale(1)}}

/* text + progress */
.loader-title{font-family:'Space Grotesk';font-size:clamp(24px,4vw,34px);letter-spacing:-.04em;margin:14px 0 6px}
.loader-quip{color:var(--muted);font-size:15px;font-weight:600;margin:0 0 22px;min-height:22px;animation:quipIn .5s ease}
@keyframes quipIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.loader-track{width:min(300px,80vw);height:9px;border-radius:99px;background:#e7e0f5;overflow:hidden;border:1px solid #d8ceff}
.loader-fill{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,var(--violet),#a78dff,var(--lime));background-size:200% 100%;animation:fillSlide 1.4s ease-in-out infinite,fillShimmer 2s linear infinite}
@keyframes fillSlide{0%{margin-left:-40%}100%{margin-left:100%}}
@keyframes fillShimmer{to{background-position:200% 0}}
.loader-dots{display:flex;gap:7px;margin-top:16px}
.loader-dots i{width:9px;height:9px;border-radius:50%;background:var(--violet);animation:dotJump 1s ease-in-out infinite}
.loader-dots i:nth-child(2){animation-delay:.15s;background:#a78dff}
.loader-dots i:nth-child(3){animation-delay:.3s;background:var(--lime)}
@keyframes dotJump{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-8px);opacity:1}}

@media(max-width:680px){.loader-stage{width:240px;height:220px}.loader-stage .doodle-body{width:128px;height:142px}}
@media(prefers-reduced-motion:reduce){.loader-screen *{animation-duration:6s!important}}
</style></head><body>
<div class="demo-controls">
  <button data-m="auto" class="on">Auto</button>
  <button data-m="is-dancing">Dance</button>
  <button data-m="is-walking">Walk</button>
  <button data-m="is-juggling">Juggle</button>
  <button data-m="is-cartwheel">Spin</button>
</div>
<main class="loader-screen">
  <div class="loader-bg"><span class="blob blob-a"></span><span class="blob blob-b"></span><span class="blob blob-c"></span></div>
  <div class="loader-inner">
    <div class="loader-brand"><span class="brand"><span class="brand-mark">✦</span> EduSwarm</span></div>
    <div class="loader-stage is-dancing" id="stage">
      <span class="loader-shadow"></span>
      <span class="prop prop-note note-1">♪</span><span class="prop prop-note note-2">♫</span>
      <span class="prop prop-book">📖</span>
      <span class="prop prop-star star-1">✦</span><span class="prop prop-star star-2">✧</span>
      <span class="prop juggle-ball ball-1"></span><span class="prop juggle-ball ball-2"></span><span class="prop juggle-ball ball-3"></span>
      <div class="loader-doodle">
        <span class="doodle-arm arm-left"></span><span class="doodle-arm arm-right"></span>
        <div class="doodle-antenna"></div>
        <div class="doodle-body"><i class="eye left"></i><i class="eye right"></i><span class="cheek cheek-left"></span><span class="cheek cheek-right"></span><span class="smile"></span></div>
        <div class="doodle-feet"><i class="foot-left"></i><i class="foot-right"></i></div>
      </div>
    </div>
    <h1 class="loader-title">Loading your learning universe…</h1>
    <p class="loader-quip" id="quip">Waking up your study buddy…</p>
    <div class="loader-track"><span class="loader-fill"></span></div>
    <div class="loader-dots"><i></i><i></i><i></i></div>
  </div>
</main>
<script>
var moods=['is-dancing','is-walking','is-juggling','is-cartwheel'];
var quips=['Waking up your study buddy…','Juggling a few equations…','Doing a little victory dance…','Untangling the syllabus…','Practising some silly walks…','Sharpening the flashcards…','Chasing down that lost brain cell…','Warming up the learning swarm…'];
var stage=document.getElementById('stage'),quip=document.getElementById('quip'),i=0,q=0,auto=true;
function setMood(m){stage.className='loader-stage '+m;}
setInterval(function(){if(auto){i=(i+1)%moods.length;setMood(moods[i]);}},3400);
setInterval(function(){q=(q+1)%quips.length;quip.textContent=quips[q];},2200);
document.querySelectorAll('.demo-controls button').forEach(function(b){b.onclick=function(){
  document.querySelectorAll('.demo-controls button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');
  if(b.dataset.m==='auto'){auto=true;}else{auto=false;setMood(b.dataset.m);}
};});
</script></body></html>
