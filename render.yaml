services:
  - type: web
    name: eduswarm-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AGENT_RUNTIME_URL
        value: https://eduswarm-agent.onrender.com
      - key: CORS_ORIGINS
        value: https://eduswarm-web.onrender.com
      - key: ALLOW_LOCAL_FALLBACK
        value: 'true'
      - key: AUTH_MODE
        value: google
      - key: PUBLIC_API_URL
        value: https://eduswarm-api.onrender.com
      - key: OAUTH_REDIRECT_URI
        value: https://eduswarm-api.onrender.com/auth/google/callback
      - key: WEB_URL
        value: https://eduswarm-web.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      # Specialist agents call this directly when the agent runtime is asleep,
      # so the API needs its own key (same value as the agent service).
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      # Optional hints only: the chain is discovered from OpenRouter's live
      # catalogue. Empty is the safe default — a pinned id that dies is simply
      # ignored, so a model change can never take the platform down.
      # NOTE: clear any leftover values in the Render dashboard for BOTH
      # services; dashboard values override this file.
      - key: OPENROUTER_MODEL
        value: ''
      - key: OPENROUTER_FALLBACK_MODELS
        value: ''
      # Optional cheap PAID model, tried only after every free model failed.
      - key: OPENROUTER_PAID_FALLBACK_MODEL
        sync: false
      - key: LLM_TIMEOUT_MS
        value: '75000'
      - key: AGENT_RUNTIME_TIMEOUT_MS
        value: '30000'
      - key: AGENT_RUNTIME_MAX_WAIT_MS
        value: '600000'
      - key: AGENT_CHAT_TIMEOUT_MS
        value: '240000'
  - type: web
    name: eduswarm-agent
    runtime: python
    rootDir: services/agent-runtime
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /health
    disk:
      name: agent-runtime-state
      mountPath: /tmp/eduswarm-state
      sizeGB: 1
    envVars:
      - key: EDUSWARM_STATE_DIR
        value: /tmp/eduswarm-state
      # Offline evidence tier: seeded local study kits keep a topic teachable
      # when Qdrant is empty. Seed with `python seed_knowledge.py --local-kits`.
      - key: EDUSWARM_LOCAL_KITS_DIR
        value: /tmp/eduswarm-state/local-kits
      - key: OPENROUTER_API_KEY
        sync: false
      # Optional hints only — see the API service note above. Clear these in
      # the Render dashboard too, or a stale id keeps winning over the code.
      - key: OPENROUTER_MODEL
        value: ''
      - key: OPENROUTER_FALLBACK_MODELS
        value: ''
      - key: OPENROUTER_PAID_FALLBACK_MODEL
        sync: false
      - key: OPENROUTER_REQUEST_TIMEOUT_SECONDS
        value: 150
      - key: OPENROUTER_STRUCTURED_MAX_TOKENS
        value: 4096
      - key: OPENROUTER_STRUCTURED_MAX_MODELS
        value: 6
      # Total lesson budget, kept below AGENT_RUNTIME_MAX_WAIT_MS (600000ms).
      - key: OPENROUTER_STRUCTURED_TOTAL_BUDGET_SECONDS
        value: 480
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: eduswarm_knowledge
  - type: web
    name: eduswarm-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://eduswarm-api.onrender.com
