services:
  - type: web
    name: eduswarm-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AGENT_RUNTIME_URL
        value: https://eduswarm-agent.onrender.com
      - key: CORS_ORIGINS
        value: https://eduswarm-web.onrender.com
      - key: ALLOW_LOCAL_FALLBACK
        value: 'true'
      - key: AUTH_MODE
        value: google
      - key: PUBLIC_API_URL
        value: https://eduswarm-api.onrender.com
      - key: OAUTH_REDIRECT_URI
        value: https://eduswarm-api.onrender.com/auth/google/callback
      - key: WEB_URL
        value: https://eduswarm-web.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      # Specialist agents call this directly when the agent runtime is asleep,
      # so the API needs its own key (same value as the agent service).
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      - key: OPENROUTER_FALLBACK_MODELS
        value: deepseek/deepseek-chat-v3-0324:free,qwen/qwen-2.5-72b-instruct:free,openrouter/free
      - key: LLM_TIMEOUT_MS
        value: '90000'
  - type: web
    name: eduswarm-agent
    runtime: python
    rootDir: services/agent-runtime
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /health
    disk:
      name: agent-runtime-state
      mountPath: /tmp/eduswarm-state
      sizeGB: 1
    envVars:
      - key: EDUSWARM_STATE_DIR
        value: /tmp/eduswarm-state
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      - key: OPENROUTER_FALLBACK_MODELS
        value: deepseek/deepseek-chat-v3-0324:free,qwen/qwen-2.5-72b-instruct:free,openrouter/free
      - key: OPENROUTER_REQUEST_TIMEOUT_SECONDS
        value: 300
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: eduswarm_knowledge
  - type: web
    name: eduswarm-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://eduswarm-api.onrender.com
